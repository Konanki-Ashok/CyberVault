version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: trustvault-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: trustvault
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustvault-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/trustvault
      JWT_ACCESS_SECRET: prod_access_secret_trustvault_secure_random_key_min32
      JWT_REFRESH_SECRET: prod_refresh_secret_trustvault_secure_random_key_min32
      COOKIE_SECRET: prod_cookie_secret_trustvault_secure_random_key_min32
      FRONTEND_ORIGIN: http://localhost:80
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: /app/uploads
      AI_SERVICE_ENABLED: "false"
    volumes:
      - vault-storage:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustvault-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  vault-storage:
